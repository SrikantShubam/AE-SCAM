name: guardian
description: "Guardian elder-safety app."
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod:
  riverpod_annotation:
  go_router:
  shared_preferences:
  sqflite:
  path:
  dio:
  firebase_core:
  firebase_auth:
  cloud_firestore:
  firebase_messaging:
  firebase_storage:
  firebase_crashlytics:
  google_sign_in:
  flutter_local_notifications:
  permission_handler:
  intl:
  image_picker:
  flutter_dotenv:
  url_launcher:
  crypto:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:
  riverpod_generator:
  build_runner:
  mockito:
  fake_cloud_firestore:

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env.example
    - assets_to_be_used/logo.png
    - assets/branding/guardian_logo.png
    - assets/scam_templates/seed_en.json
